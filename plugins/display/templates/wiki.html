<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - GlaDOS Wiki</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #1a1a2e;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
        }

        /* Sidebar */
        .sidebar {
            width: 240px;
            min-height: 100vh;
            background: rgba(255, 255, 255, 0.04);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            padding: 24px 16px;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar-brand {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ff6600;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .sidebar-brand a {
            color: #ff6600;
            text-decoration: none;
        }

        .sidebar-subtitle {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .sidebar nav a {
            display: block;
            padding: 8px 12px;
            margin: 2px 0;
            color: #bbb;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: background 0.2s, color 0.2s;
        }

        .sidebar nav a:hover {
            background: rgba(255, 102, 0, 0.1);
            color: #ff6600;
        }

        .sidebar nav a.active {
            background: rgba(255, 102, 0, 0.15);
            color: #ff6600;
            font-weight: 600;
        }

        .sidebar .back-link {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .sidebar .back-link a {
            color: #888;
            font-size: 0.8rem;
        }

        /* Main content */
        .content {
            flex: 1;
            padding: 40px 48px;
            max-width: 900px;
            overflow-y: auto;
        }

        /* Typography */
        .content h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #ff6600;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 102, 0, 0.2);
        }

        .content h2 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #e0e0e0;
            margin-top: 32px;
            margin-bottom: 12px;
        }

        .content h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #ccc;
            margin-top: 24px;
            margin-bottom: 8px;
        }

        .content p {
            line-height: 1.7;
            margin-bottom: 12px;
            color: #ccc;
        }

        .content a {
            color: #ff6600;
            text-decoration: none;
        }

        .content a:hover {
            text-decoration: underline;
        }

        .content ul, .content ol {
            margin: 8px 0 16px 24px;
            color: #ccc;
        }

        .content li {
            line-height: 1.6;
            margin-bottom: 4px;
        }

        .content code {
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 0.85em;
            color: #f0c674;
        }

        .content pre {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 16px 20px;
            overflow-x: auto;
            margin: 12px 0 20px;
            line-height: 1.5;
        }

        .content pre code {
            background: none;
            padding: 0;
            color: #e0e0e0;
            font-size: 0.85rem;
        }

        .content table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0 20px;
        }

        .content th {
            text-align: left;
            padding: 10px 12px;
            background: rgba(255, 102, 0, 0.1);
            color: #ff6600;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            border-bottom: 1px solid rgba(255, 102, 0, 0.2);
        }

        .content td {
            padding: 8px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            color: #ccc;
            font-size: 0.9rem;
        }

        .content tr:hover td {
            background: rgba(255, 255, 255, 0.03);
        }

        .content strong {
            color: #e0e0e0;
        }

        .content blockquote {
            border-left: 3px solid #ff6600;
            padding: 8px 16px;
            margin: 12px 0;
            background: rgba(255, 102, 0, 0.05);
            color: #ccc;
        }

        /* Mobile */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar {
                width: 100%;
                min-height: auto;
                height: auto;
                position: relative;
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.08);
                padding: 16px;
            }
            .sidebar nav { display: flex; flex-wrap: wrap; gap: 4px; }
            .sidebar nav a { padding: 6px 10px; font-size: 0.8rem; }
            .content { padding: 24px 16px; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-brand"><a href="/wiki">GlaDOS</a></div>
        <div class="sidebar-subtitle">Wiki</div>
        <nav>
            {% for page in sidebar_pages %}
            <a href="/wiki/{{ page.slug }}"
               class="{{ 'active' if page.slug == current_page else '' }}">{{ page.title }}</a>
            {% endfor %}
        </nav>
        <div class="back-link">
            <a href="/">&#8592; Back to Display</a>
        </div>
    </div>
    <div class="content">
        {{ content | safe }}
    </div>
</body>
</html>
