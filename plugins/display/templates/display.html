<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>GlaDOS Display</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #1a1a2e;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* ── Layout ─────────────────────────────────────── */
        #chat-panel {
            width: 35%;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255,255,255,0.08);
            background: #16162a;
        }

        #content-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-y: auto;
        }

        /* ── Top bar ────────────────────────────────────── */
        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 10;
        }

        #activity-indicator {
            font-size: 0.85rem;
            color: #aaa;
            background: rgba(255,255,255,0.05);
            padding: 4px 12px;
            border-radius: 12px;
        }

        .activity-icon { margin-right: 4px; }

        #top-right { display: flex; gap: 12px; align-items: center; font-size: 0.8rem; }
        #wiki-link, .nav-link { color: #ff6600; text-decoration: none; cursor: pointer; }
        .nav-link:hover { text-decoration: underline; }
        #connection-status { color: #4caf50; }
        #connection-status.disconnected { color: #f44336; }

        /* ── Chat history ───────────────────────────────── */
        #chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Push bubbles to bottom when content doesn't fill the panel */
        #chat-history::before {
            content: '';
            flex: 1;
        }

        .chat-bubble {
            max-width: 85%;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.4;
            word-wrap: break-word;
            overflow-wrap: break-word;
            word-break: break-word;
        }

        .chat-bubble.user {
            align-self: flex-end;
            background: #2a3a5c;
            border-bottom-right-radius: 4px;
            color: #c8d8f8;
        }

        .chat-bubble.assistant {
            align-self: flex-start;
            background: #2a2a3e;
            border-bottom-left-radius: 4px;
        }

        .chat-bubble.assistant .streaming {
            color: #888;
        }

        .chat-bubble.assistant .spoken {
            color: #ff8c00;
        }

        .bubble-time {
            font-size: 0.65rem;
            color: #666;
            margin-top: 4px;
        }

        .bubble-no-sources {
            font-size: 0.65rem;
            color: #666;
            margin-top: 2px;
            font-style: italic;
        }

        /* Collapsible bubbles (knowledge, thinking, tool) */
        .chat-bubble.collapsible {
            padding: 2px 0;
            overflow: hidden;
            margin: 4px 0;
        }

        .bubble-header {
            padding: 10px 14px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            user-select: none;
            min-height: 36px;
        }

        .bubble-header:hover { filter: brightness(1.2); background: rgba(255,255,255,0.03); }
        .bubble-header .toggle { font-size: 0.7rem; transition: transform 0.2s; margin-left: 8px; flex-shrink: 0; }
        .collapsible.expanded .toggle { transform: rotate(90deg); }

        .bubble-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            padding: 0 14px;
            font-size: 0.8rem;
            color: #aaa;
            white-space: pre-wrap;
        }

        .collapsible.expanded .bubble-content {
            max-height: 500px;
            overflow-y: auto;
            padding: 6px 14px 12px;
        }

        .chat-bubble.knowledge {
            background: rgba(76, 175, 80, 0.1);
            border-left: 3px solid #4caf50;
        }
        .chat-bubble.knowledge .bubble-header { color: #81c784; }

        .chat-bubble.thinking {
            background: rgba(156, 39, 176, 0.1);
            border-left: 3px solid #9c27b0;
        }
        .chat-bubble.thinking .bubble-header { color: #ce93d8; }

        .chat-bubble.tool-call {
            background: rgba(33, 150, 243, 0.1);
            border-left: 3px solid #2196f3;
        }
        .chat-bubble.tool-call .bubble-header { color: #64b5f6; }

        .chat-bubble.nlp-tool {
            background: rgba(0, 188, 212, 0.1);
            border-left: 3px solid #00bcd4;
        }
        .chat-bubble.nlp-tool .bubble-header { color: #4dd0e1; }

        .chat-bubble.tool-result {
            background: rgba(33, 150, 243, 0.05);
            border-left: 3px solid rgba(33, 150, 243, 0.3);
        }
        .chat-bubble.tool-result .bubble-header { color: #90caf9; font-size: 0.75rem; }

        .chat-bubble.async-event {
            background: rgba(255, 193, 7, 0.1);
            border-left: 3px solid #ffc107;
        }
        .chat-bubble.async-event .bubble-header { color: #ffd54f; }

        /* ── Chat input ─────────────────────────────────── */
        #chat-input-bar {
            display: flex;
            gap: 6px;
            padding: 8px 12px;
            background: rgba(0,0,0,0.3);
            border-top: 1px solid rgba(255, 102, 0, 0.3);
        }

        #chat-input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            color: #e0e0e0;
            font-size: 0.9rem;
            outline: none;
        }

        #chat-input:focus { border-color: #ff6600; }

        #chat-send {
            padding: 8px 14px;
            background: #ff6600;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        #chat-interrupt {
            padding: 8px 10px;
            background: rgba(244, 67, 54, 0.15);
            color: #f44336;
            border: 1px solid rgba(244, 67, 54, 0.4);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        /* ── Content area (right panel) ─────────────────── */
        #display-container {
            flex: 1;
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        #glados-avatar {
            position: fixed;
            right: 0;
            bottom: 0;
            width: 28vw;
            max-width: 400px;
            opacity: 0.15;
            pointer-events: none;
            z-index: 1;
        }

        /* ── Status toast (centered in content panel) ──── */
        #status-toast {
            position: fixed;
            bottom: 20%;
            left: calc(35% + (65% / 2));
            transform: translateX(-50%);
            padding: 20px 32px;
            border-radius: 16px;
            background: rgba(20, 20, 40, 0.9);
            backdrop-filter: blur(12px);
            font-size: 1.4rem;
            max-width: 55%;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 100;
            line-height: 1.5;
            border: 1px solid rgba(255, 102, 0, 0.15);
        }

        #status-toast.visible { opacity: 1; }
        .status-icon { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
        .status-listening .status-icon { background: #4caf50; animation: pulse 1.5s infinite; }
        .status-thinking .status-icon { background: #ff9800; animation: pulse 1s infinite; }
        .status-speaking .status-icon { background: #ff6600; animation: pulse 0.8s infinite; }
        .status-speaking { color: #ff8c00; }
        .status-tool_call .status-icon { background: #2196f3; animation: spin 1s linear infinite; }
        .status-idle .status-icon { background: #666; }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes flash { 0%, 100% { background: #1a1a2e; } 50% { background: #4a1a1a; } }
        .flash-alert { animation: flash 0.5s ease-in-out 6; }

        /* ── Content views ──────────────────────────────── */
        .view-idle {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .view-idle .brand { font-size: 3.5rem; font-weight: 700; color: #ff6600; letter-spacing: 0.1em; margin-bottom: 12px; }
        .view-idle .clock { font-size: 4.5rem; font-weight: 200; color: #e0e0e0; margin-bottom: 8px; }
        .view-idle .date { font-size: 1.2rem; color: #888; }

        .view-title { font-size: 1.5rem; font-weight: 600; color: #ff6600; margin-bottom: 16px; border-bottom: 1px solid rgba(255,102,0,0.2); padding-bottom: 8px; }

        .recipe-section-label { font-size: 1rem; font-weight: 600; color: #ff6600; margin: 16px 0 8px; text-transform: uppercase; letter-spacing: 0.05em; }
        .ingredient-list { list-style: disc; padding-left: 24px; }
        .ingredient-list li { margin: 4px 0; color: #ccc; }

        .step-list { list-style: none; counter-reset: step; padding-left: 0; }
        .step-list li { counter-increment: step; margin: 12px 0; padding-left: 36px; position: relative; color: #ccc; line-height: 1.5; }
        .step-list li::before { content: counter(step); position: absolute; left: 0; width: 24px; height: 24px; background: #ff6600; color: #fff; border-radius: 50%; text-align: center; line-height: 24px; font-size: 0.8rem; font-weight: 600; }

        .timer-display { display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .timer-card { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 24px 40px; text-align: center; min-width: 280px; }
        .timer-type { font-size: 1.5rem; margin-bottom: 4px; }
        .timer-name { font-size: 1.1rem; color: #aaa; margin-bottom: 8px; }
        .timer-countdown { font-size: 3.5rem; font-weight: 300; color: #ff6600; font-variant-numeric: tabular-nums; }
        .timer-expires { font-size: 0.9rem; color: #666; margin-top: 4px; }

        /* ── Floating timer overlay ────────────────────── */
        #timer-overlay {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 50;
            display: none;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        #timer-overlay.visible { display: flex; }

        .timer-float-card {
            background: rgba(20, 20, 40, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 102, 0, 0.2);
            border-radius: 12px;
            padding: 12px 20px;
            text-align: center;
            min-width: 180px;
            pointer-events: auto;
        }

        .timer-float-card .timer-type { font-size: 1.1rem; margin-bottom: 2px; }
        .timer-float-card .timer-name { font-size: 0.85rem; color: #aaa; margin-bottom: 4px; }
        .timer-float-card .timer-countdown { font-size: 2rem; font-weight: 300; color: #ff6600; font-variant-numeric: tabular-nums; }
        .timer-float-card .timer-expires { font-size: 0.75rem; color: #666; margin-top: 2px; }

        /* ── Shopping List view ────────────────────────── */
        .shopping-list { padding: 0 24px 24px; }
        .shopping-category { margin-bottom: 16px; }
        .shopping-category-header {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #888;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 6px;
        }
        .shopping-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 4px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .shopping-item:hover { background: rgba(255,255,255,0.04); }
        .shopping-item.got { opacity: 0.4; }
        .shopping-item.got .shopping-item-name { text-decoration: line-through; }
        .shopping-item-check {
            width: 22px; height: 22px;
            border: 2px solid #555;
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            transition: all 0.15s;
        }
        .shopping-item.got .shopping-item-check {
            background: #ff6600;
            border-color: #ff6600;
        }
        .shopping-item-check::after {
            content: '';
            display: none;
            width: 6px; height: 10px;
            border: solid #fff; border-width: 0 2px 2px 0;
            transform: rotate(45deg);
            margin-bottom: 2px;
        }
        .shopping-item.got .shopping-item-check::after { display: block; }
        .shopping-item-name { flex: 1; font-size: 0.95rem; }
        .shopping-item-qty {
            font-size: 0.75rem;
            color: #aaa;
            background: rgba(255,255,255,0.06);
            padding: 2px 8px;
            border-radius: 8px;
        }
        .shopping-recurring-select {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px;
            color: #888;
            font-size: 0.7rem;
            padding: 1px 2px;
            cursor: pointer;
            color-scheme: dark;
        }
        .shopping-recurring-select.active { color: #ff6600; border-color: rgba(255,102,0,0.3); }
        .shopping-recurring-select:hover { border-color: #ff6600; }
        .shopping-add-form {
            display: flex;
            gap: 8px;
            padding: 8px 24px 12px;
        }
        .shopping-add-form input {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 8px 12px;
            color: #e0e0e0;
            font-size: 0.85rem;
        }
        .shopping-add-form input:first-child { flex: 1; }
        .shopping-add-form input:focus { border-color: #ff6600; outline: none; }
        .shopping-add-form button {
            background: #ff6600;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .shopping-item-remove {
            font-size: 0.8rem; color: #666;
            background: none; border: none; cursor: pointer;
            padding: 4px 8px; border-radius: 4px;
        }
        .shopping-item-remove:hover { color: #e55; background: rgba(255,0,0,0.08); }
        .shopping-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            border-top: 1px solid rgba(255,255,255,0.06);
            margin-top: 8px;
        }
        .shopping-progress { font-size: 0.85rem; color: #888; }
        .shopping-done-btn {
            background: #ff6600;
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: opacity 0.15s;
        }
        .shopping-done-btn:hover { opacity: 0.85; }

        /* ── Pantry view ───────────────────────────────── */
        .pantry-view { padding: 0 24px 24px; }
        .pantry-expiry-banner {
            background: rgba(255,80,0,0.12);
            border: 1px solid rgba(255,80,0,0.25);
            border-radius: 10px;
            padding: 10px 16px;
            margin-bottom: 16px;
            font-size: 0.85rem;
        }
        .pantry-expiry-banner-title { color: #ff6600; font-weight: 600; margin-bottom: 4px; }
        .pantry-location {
            margin-bottom: 12px;
            background: rgba(255,255,255,0.02);
            border-radius: 10px;
            overflow: hidden;
        }
        .pantry-location-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            cursor: pointer;
            background: rgba(255,255,255,0.04);
            transition: background 0.15s;
        }
        .pantry-location-header:hover { background: rgba(255,255,255,0.06); }
        .pantry-location-name { font-size: 0.95rem; font-weight: 500; }
        .pantry-location-count {
            font-size: 0.75rem;
            color: #888;
            background: rgba(255,255,255,0.06);
            padding: 2px 8px;
            border-radius: 8px;
        }
        .pantry-location-items { padding: 0 16px; display: none; }
        .pantry-location.expanded .pantry-location-items { display: block; }
        .pantry-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            font-size: 0.9rem;
        }
        .pantry-item:last-child { border-bottom: none; }
        .pantry-item-name { flex: 1; }
        .pantry-item-notes { font-size: 0.75rem; color: #888; }
        .pantry-item-expiry {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 8px;
        }
        .pantry-item-expiry.expired { color: #ff4444; background: rgba(255,68,68,0.12); }
        .pantry-item-expiry.expiring-soon { color: #ff8800; background: rgba(255,136,0,0.12); }
        .pantry-item-expiry.expiring-week { color: #ffcc00; background: rgba(255,204,0,0.10); }
        .pantry-item-expiry.ok { color: #66bb6a; background: rgba(102,187,106,0.10); }
        .pantry-item-remove {
            font-size: 0.8rem; color: #666;
            background: none; border: none; cursor: pointer;
            padding: 4px 8px; border-radius: 4px;
        }
        .pantry-item-remove:hover { color: #e55; background: rgba(255,0,0,0.08); }
        .pantry-expiry-picker {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px;
            color: inherit;
            font-size: 0.7rem;
            padding: 1px 4px;
            width: 110px;
            color-scheme: dark;
            cursor: pointer;
        }
        .pantry-expiry-picker:hover { border-color: #ff6600; }
        .pantry-expiry-picker.empty { width: 28px; opacity: 0.5; }
        .pantry-expiry-picker.empty:hover { opacity: 1; }
        .pantry-item-set-expiry { display: inline-flex; align-items: center; }
        .pantry-add-item {
            display: flex;
            gap: 6px;
            padding: 8px 0;
            border-top: 1px solid rgba(255,255,255,0.04);
            margin-top: 4px;
        }
        .pantry-add-item input {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            padding: 5px 8px;
            color: #e0e0e0;
            font-size: 0.8rem;
        }
        .pantry-add-item input:first-child { flex: 1; }
        .pantry-add-item input:focus { border-color: #ff6600; outline: none; }
        .pantry-add-item input[type="date"] { color-scheme: dark; }
        .pantry-add-item button {
            background: #ff6600;
            color: #fff;
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .pantry-empty { color: #555; font-style: italic; padding: 8px 0; font-size: 0.85rem; }
        .pantry-add-location {
            display: flex;
            gap: 8px;
            padding: 12px 0;
            margin-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .pantry-add-location input {
            flex: 1;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 6px 12px;
            color: #e0e0e0;
            font-size: 0.85rem;
        }
        .pantry-add-location button {
            background: #ff6600;
            color: #fff;
            border: none;
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .info-content { font-size: 1rem; color: #ccc; white-space: pre-wrap; line-height: 1.6; }

        /* Mobile: stack vertically */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #chat-panel { width: 100%; height: 50vh; min-width: unset; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.08); }
            #content-panel { height: 50vh; }
            #glados-avatar { width: 40vw; }
            #status-toast {
                left: 50%;
                bottom: 30%;
                max-width: 90%;
                font-size: 1.2rem;
            }
            #timer-overlay { top: 8px; right: 8px; }
            .timer-float-card { min-width: 140px; padding: 8px 14px; }
            .timer-float-card .timer-countdown { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <!-- Left: Chat panel -->
    <div id="chat-panel">
        <div id="top-bar">
            <div id="activity-indicator"><span class="activity-icon">🏠</span>general</div>
            <div id="top-right">
                <span class="nav-link" onclick="socket.emit('shopping_list_action', {action:'show'})">List</span>
                <span class="nav-link" onclick="socket.emit('pantry_action', {action:'show'})">Pantry</span>
                <a id="wiki-link" href="/wiki">Wiki</a>
                <div id="connection-status" class="connected">connected</div>
            </div>
        </div>
        <div id="chat-history"></div>
        <div id="chat-input-bar">
            <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off" />
            <button id="chat-send">Send</button>
            <button id="chat-interrupt" title="Interrupt GlaDOS">Stop</button>
        </div>
    </div>

    <!-- Right: Content area -->
    <div id="content-panel">
        <img id="glados-avatar" src="/images/glados.gif" alt="GlaDOS">
        <div id="display-container"></div>
        <div id="timer-overlay"></div>
    </div>

    <!-- Status toast -->
    <div id="status-toast">
        <div class="status-icon"></div>
        <div class="status-text"></div>
    </div>

    <script src="/static/socket.io.min.js"></script>
    <script>
        const container = document.getElementById('display-container');
        const chatHistory = document.getElementById('chat-history');
        const statusEl = document.getElementById('connection-status');
        let clockInterval = null;
        let currentAssistantBubble = null;  // for streaming tokens

        const socket = io({
            reconnection: true,
            reconnectionDelay: 1000,
            reconnectionAttempts: Infinity,
            transports: ['websocket', 'polling']
        });

        socket.on('connect', () => { statusEl.textContent = 'connected'; statusEl.className = 'connected'; });
        socket.on('disconnect', () => { statusEl.textContent = 'reconnecting...'; statusEl.className = 'disconnected'; });

        // ── Display content (right panel) ──────────────
        socket.on('display_update', (data) => {
            if (clockInterval) { clearInterval(clockInterval); clockInterval = null; }
            renderView(data);
            if (data.alert) {
                document.body.classList.add('flash-alert');
                setTimeout(() => document.body.classList.remove('flash-alert'), 3000);
            }
        });

        const timerOverlay = document.getElementById('timer-overlay');

        function renderView(data) {
            const vt = data.view_type || 'idle';
            if (vt === 'timer') {
                // Timers float as an overlay — don't replace the main content
                renderTimerOverlay(data);
                return;
            }
            // Non-timer views clear the timer overlay
            timerOverlay.classList.remove('visible');
            timerOverlay.innerHTML = '';
            if (vt === 'idle') renderIdle();
            else if (vt === 'recipe') renderRecipe(data);
            else if (vt === 'info') renderInfo(data);
            else if (vt === 'shopping_list') renderShoppingList(data);
            else if (vt === 'pantry') renderPantry(data);
            else renderIdle();
        }

        function renderIdle() {
            function update() {
                const now = new Date();
                const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const date = now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
                container.innerHTML = `<div class="view-idle"><div class="brand">GlaDOS</div><div class="clock">${time}</div><div class="date">${date}</div></div>`;
            }
            update();
            clockInterval = setInterval(update, 1000);
        }

        function renderRecipe(data) {
            const title = data.title || 'Recipe';
            if (data.ingredients && data.directions) {
                const ings = (Array.isArray(data.ingredients) ? data.ingredients : data.ingredients.split('\n'))
                    .map(i => i.replace(/^[-\s]*/, '').trim()).filter(Boolean).map(i => `<li>${i}</li>`).join('');
                const steps = (Array.isArray(data.directions) ? data.directions : data.directions.split('\n'))
                    .map(s => s.replace(/^(Step\s*\d+[:\s]*)/i, '').trim()).filter(Boolean).map(s => `<li>${s}</li>`).join('');
                container.innerHTML = `<div class="view-title">${esc(title)}</div><div class="recipe-section-label">Ingredients</div><ul class="ingredient-list">${ings}</ul><div class="recipe-section-label">Directions</div><ol class="step-list">${steps}</ol>`;
            } else {
                container.innerHTML = `<div class="view-title">${esc(title)}</div><div class="info-content">${esc(data.content || '')}</div>`;
            }
        }

        function renderTimerOverlay(data) {
            if (data.timers && data.timers.length > 0) {
                const cards = data.timers.map(t => {
                    const icon = t.type === 'alarm' ? '⏰' : '⏱';
                    return `<div class="timer-float-card"><div class="timer-type">${icon}</div><div class="timer-name">${esc(t.description || 'Timer')}</div><div class="timer-countdown">${esc(t.expires_in || '--')}</div><div class="timer-expires">until ${esc(t.expires_at || '')}</div></div>`;
                }).join('');
                timerOverlay.innerHTML = cards;
                timerOverlay.classList.add('visible');
            } else {
                timerOverlay.classList.remove('visible');
                timerOverlay.innerHTML = '';
            }
        }

        function renderInfo(data) {
            container.innerHTML = `<div class="view-title">${esc(data.title || 'Information')}</div><div class="info-content">${esc(data.content || '')}</div>`;
        }

        function renderShoppingList(data) {
            const items = data.items || [];
            const total = data.total || items.length;
            const gotCount = items.filter(i => i.got).length;

            // Add-item form (always shown)
            let addForm = `<div class="shopping-add-form">
                <input type="text" id="add-item-name" placeholder="Add item..." onkeydown="if(event.key==='Enter') addShoppingItemUI()">
                <input type="text" id="add-item-qty" placeholder="Qty" style="width:80px;" onkeydown="if(event.key==='Enter') addShoppingItemUI()">
                <button onclick="addShoppingItemUI()">Add</button>
            </div>`;

            if (items.length === 0) {
                container.innerHTML = `<div class="view-title">Shopping List</div>${addForm}<div class="info-content" style="text-align:center; color:#666; padding:40px;">The shopping list is empty.</div>`;
                return;
            }

            // Group by category
            const categories = {};
            const categoryOrder = ['dairy', 'produce', 'meat', 'seafood', 'bakery', 'frozen', 'dry_goods', 'beverages', 'condiments', 'snacks', 'other'];
            const categoryLabels = {
                dairy: 'Dairy & Eggs', produce: 'Produce', meat: 'Meat', seafood: 'Seafood',
                bakery: 'Bakery', frozen: 'Frozen', dry_goods: 'Dry Goods',
                beverages: 'Beverages', condiments: 'Condiments', snacks: 'Snacks', other: 'Other'
            };
            items.forEach(item => {
                const cat = item.category || 'other';
                if (!categories[cat]) categories[cat] = [];
                categories[cat].push(item);
            });

            let html = '';
            categoryOrder.forEach(cat => {
                if (!categories[cat] || categories[cat].length === 0) return;
                const label = categoryLabels[cat] || cat;
                html += `<div class="shopping-category"><div class="shopping-category-header">${esc(label)}</div>`;
                categories[cat].sort((a, b) => a.name.localeCompare(b.name));
                categories[cat].forEach(item => {
                    const gotClass = item.got ? ' got' : '';
                    const qty = item.quantity ? `<span class="shopping-item-qty">${esc(item.quantity)}</span>` : '';
                    const recurringOpts = [0,3,7,10,14,30].map(d => {
                        const label = d === 0 ? 'Off' : d + 'd';
                        const sel = (item.recurring_days || 0) === d ? ' selected' : '';
                        return `<option value="${d}"${sel}>${label}</option>`;
                    }).join('');
                    const recurringBadge = `<select class="shopping-recurring-select${item.recurring ? ' active' : ''}" onclick="event.stopPropagation()" onchange="setRecurring('${item.id}', this.value)" title="Recurring interval">${recurringOpts}</select>`;
                    html += `<div class="shopping-item${gotClass}" onclick="toggleShoppingItem('${item.id}')">
                        <div class="shopping-item-check"></div>
                        <span class="shopping-item-name">${esc(item.name)}</span>
                        ${qty}${recurringBadge}
                        <button class="shopping-item-remove" onclick="event.stopPropagation(); removeShoppingItem('${item.id}')" title="Remove">✕</button>
                    </div>`;
                });
                html += '</div>';
            });

            container.innerHTML = `<div class="view-title">${esc(data.title || 'Shopping List')}</div>
                ${addForm}
                <div class="shopping-list">${html}</div>
                <div class="shopping-footer">
                    <span class="shopping-progress">${gotCount} of ${total} items</span>
                    ${gotCount > 0 ? '<button class="shopping-done-btn" onclick="completeShoppingUI()">Done Shopping</button>' : ''}
                </div>`;
        }

        function toggleShoppingItem(itemId) {
            socket.emit('shopping_list_action', { action: 'toggle', item_id: itemId });
        }
        function removeShoppingItem(itemId) {
            socket.emit('shopping_list_action', { action: 'remove', item_id: itemId });
        }
        function completeShoppingUI() {
            socket.emit('shopping_list_action', { action: 'complete' });
        }
        function addShoppingItemUI() {
            const nameEl = document.getElementById('add-item-name');
            const qtyEl = document.getElementById('add-item-qty');
            if (nameEl && nameEl.value.trim()) {
                socket.emit('shopping_list_action', {
                    action: 'add_item',
                    name: nameEl.value.trim(),
                    quantity: qtyEl ? qtyEl.value.trim() : '',
                });
                nameEl.value = '';
                if (qtyEl) qtyEl.value = '';
            }
        }
        function setRecurring(itemId, value) {
            socket.emit('shopping_list_action', { action: 'set_recurring', item_id: itemId, interval_days: parseInt(value) || 0 });
        }

        function renderPantry(data) {
            const locations = data.locations || [];
            const expiringSoon = data.expiring_soon || [];

            let html = '';

            // Expiring soon banner
            if (expiringSoon.length > 0) {
                const items = expiringSoon.map(i => {
                    const label = i.days_left < 0 ? 'expired' : i.days_left === 0 ? 'today' : i.days_left === 1 ? 'tomorrow' : `in ${i.days_left} days`;
                    return `<div>${esc(i.name)} (${esc(i.location)}) — ${label}</div>`;
                }).join('');
                html += `<div class="pantry-expiry-banner"><div class="pantry-expiry-banner-title">⚠ Expiring Soon</div>${items}</div>`;
            }

            // Locations
            locations.forEach((loc, idx) => {
                const expanded = idx === 0 || loc.items.length > 0 ? ' expanded' : '';
                const itemCount = loc.items.length;
                let itemsHtml = '';
                if (itemCount === 0) {
                    itemsHtml = '<div class="pantry-empty">Empty</div>';
                } else {
                    loc.items.forEach(item => {
                        const notes = item.notes ? `<span class="pantry-item-notes">${esc(item.notes)}</span>` : '';
                        let expiryHtml = '';
                        if (item.expires) {
                            const expDate = new Date(item.expires + 'T00:00:00');
                            const today = new Date(); today.setHours(0,0,0,0);
                            const daysLeft = Math.floor((expDate - today) / 86400000);
                            let cls = 'ok';
                            if (daysLeft <= 0) cls = 'expired';
                            else if (daysLeft <= 3) cls = 'expiring-soon';
                            else if (daysLeft <= 7) cls = 'expiring-week';
                            const relLabel = daysLeft < 0 ? 'expired' : daysLeft === 0 ? 'today' : daysLeft === 1 ? 'tomorrow' : `${daysLeft}d`;
                            expiryHtml = `<span class="pantry-item-expiry ${cls}">${relLabel} <input type="date" class="pantry-expiry-picker" value="${item.expires}" onchange="setPantryExpiry('${item.id}', this.value)" onclick="event.stopPropagation()"></span>`;
                        } else {
                            expiryHtml = `<span class="pantry-item-set-expiry"><input type="date" class="pantry-expiry-picker empty" onchange="setPantryExpiry('${item.id}', this.value)" onclick="event.stopPropagation()" title="Set expiry"></span>`;
                        }
                        itemsHtml += `<div class="pantry-item">
                            <span class="pantry-item-name">${esc(item.name)}</span>
                            ${notes}${expiryHtml}
                            <button class="pantry-item-remove" onclick="removePantryItem('${item.id}')" title="Remove">✕</button>
                        </div>`;
                    });
                }
                // Per-location add item form
                const addItemHtml = `<div class="pantry-add-item">
                    <input type="text" placeholder="Add item..." id="pantry-add-name-${loc.id}" onkeydown="if(event.key==='Enter') addPantryItemToLocation('${loc.id}')">
                    <input type="text" placeholder="Notes" style="width:80px;" id="pantry-add-notes-${loc.id}" onkeydown="if(event.key==='Enter') addPantryItemToLocation('${loc.id}')">
                    <input type="date" id="pantry-add-exp-${loc.id}" title="Expiry date" style="width:130px;">
                    <button onclick="addPantryItemToLocation('${loc.id}')">+</button>
                </div>`;
                html += `<div class="pantry-location${expanded}">
                    <div class="pantry-location-header" onclick="this.parentElement.classList.toggle('expanded')">
                        <span class="pantry-location-name">${esc(loc.name)}</span>
                        <span class="pantry-location-count">${itemCount}</span>
                    </div>
                    <div class="pantry-location-items">${itemsHtml}${addItemHtml}</div>
                </div>`;
            });

            // Add location input
            html += `<div class="pantry-add-location">
                <input type="text" id="new-location-input" placeholder="New location name..." onkeydown="if(event.key==='Enter') addPantryLocation()">
                <button onclick="addPantryLocation()">Add</button>
            </div>`;

            container.innerHTML = `<div class="view-title">${esc(data.title || 'Pantry')}</div><div class="pantry-view">${html}</div>`;
        }

        function removePantryItem(itemId) {
            socket.emit('pantry_action', { action: 'remove_item', item_id: itemId });
        }
        function addPantryLocation() {
            const input = document.getElementById('new-location-input');
            if (input && input.value.trim()) {
                socket.emit('pantry_action', { action: 'add_location', name: input.value.trim() });
                input.value = '';
            }
        }
        function addPantryItemToLocation(locationId) {
            const nameEl = document.getElementById('pantry-add-name-' + locationId);
            const notesEl = document.getElementById('pantry-add-notes-' + locationId);
            const expEl = document.getElementById('pantry-add-exp-' + locationId);
            if (nameEl && nameEl.value.trim()) {
                socket.emit('pantry_action', {
                    action: 'add_item',
                    location_id: locationId,
                    name: nameEl.value.trim(),
                    notes: notesEl ? notesEl.value.trim() : '',
                    expires: expEl ? expEl.value : '',
                });
                nameEl.value = '';
                if (notesEl) notesEl.value = '';
                if (expEl) expEl.value = '';
            }
        }
        function setPantryExpiry(itemId, value) {
            socket.emit('pantry_action', { action: 'set_expiry', item_id: itemId, expires: value || '' });
        }

        // ── Chat messages (left panel) ─────────────────
        let lastResponseHadKnowledge = false;

        socket.on('chat_message', (data) => {
            const role = data.role || 'system';

            if (role === 'user') {
                // Only voice input arrives here (display input is rendered locally)
                finalizeStreaming();
                addBubble('user', data.content);
                lastResponseHadKnowledge = false;  // reset for upcoming response
            }
            else if (role === 'assistant_start') {
                finalizeStreaming();
                currentAssistantBubble = addBubble('assistant', '', true);
            }
            else if (role === 'assistant_token') {
                if (!currentAssistantBubble) {
                    currentAssistantBubble = addBubble('assistant', '', true);
                }
                const streamEl = currentAssistantBubble.querySelector('.streaming');
                if (streamEl) streamEl.textContent += data.token;
                scrollChat();
            }
            else if (role === 'assistant_end') {
                // Ensure full text is shown even if token events were delayed
                if (data.content) {
                    if (!currentAssistantBubble) {
                        currentAssistantBubble = addBubble('assistant', '', true);
                    }
                    const streamEl = currentAssistantBubble.querySelector('.streaming');
                    if (streamEl) streamEl.textContent = data.content;
                }
                // Add "no sources" badge if knowledge RAG was attempted but found nothing
                if (!lastResponseHadKnowledge && currentAssistantBubble) {
                    const badge = document.createElement('div');
                    badge.className = 'bubble-no-sources';
                    badge.textContent = 'answered from model \u2014 no knowledge base sources';
                    currentAssistantBubble.appendChild(badge);
                }
                lastResponseHadKnowledge = false;
                finalizeStreaming();
            }
            else if (role === 'spoken') {
                // Spoken text — streamed tokens + assistant_end already handle display
            }
            else if (role === 'knowledge_miss') {
                lastResponseHadKnowledge = false;
                handleStatusToast({status: 'idle', message: 'No knowledge base matches'});
            }
            else if (role === 'knowledge') {
                lastResponseHadKnowledge = true;
                finalizeStreaming();
                const srcNames = (data.sources || []).map(s => s.title || s.source || '?').join(', ');
                const label = srcNames ? `📚 Knowledge: ${srcNames}` : '📚 Knowledge';
                addCollapsibleBubble('knowledge', label, null, data.content);
            }
            else if (role === 'thinking') {
                addCollapsibleBubble('thinking', '💭 Thinking', null, data.content);
            }
            else if (role === 'tool_call') {
                finalizeStreaming();
                const icon = data.via === 'nlp' ? '⚡' : '🔧';
                const via = data.via === 'nlp' ? ' (NLP)' : '';
                const argsStr = JSON.stringify(data.args || {});
                const label = `${icon} ${data.tool}${via}${argsStr !== '{}' ? '(' + argsStr.substring(0, 60) + ')' : ''}`;
                addCollapsibleBubble(data.via === 'nlp' ? 'nlp-tool' : 'tool-call', label, null, data.content || '');
            }
            else if (role === 'tool_result') {
                addCollapsibleBubble('tool-result', `📋 ${data.tool} result`, null, (data.content || '').substring(0, 500));
            }
            else if (role === 'async_event') {
                addCollapsibleBubble('async-event', `🔔 ${data.source}`, null, data.content || '');
            }
        });

        function addBubble(type, text, isStreaming = false) {
            const el = document.createElement('div');
            el.className = `chat-bubble ${type}`;
            if (isStreaming) {
                el.innerHTML = `<div class="bubble-text"><span class="streaming"></span></div>`;
            } else {
                el.innerHTML = `<div class="bubble-text">${esc(text)}</div>`;
            }
            const time = document.createElement('div');
            time.className = 'bubble-time';
            time.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            el.appendChild(time);
            chatHistory.appendChild(el);
            scrollChat();
            return el;
        }

        function addCollapsibleBubble(type, label, sources, content) {
            const el = document.createElement('div');
            el.className = `chat-bubble ${type} collapsible`;
            let headerText = label;
            if (sources && sources.length) {
                headerText += ': ' + sources.map(s => s.title || s).join(', ');
            }
            el.innerHTML = `<div class="bubble-header" onclick="this.parentElement.classList.toggle('expanded')">${esc(headerText)} <span class="toggle">▶</span></div><div class="bubble-content">${esc(content || '')}</div>`;
            chatHistory.appendChild(el);
            scrollChat();
            return el;
        }

        function finalizeStreaming() {
            if (currentAssistantBubble) {
                const streamEl = currentAssistantBubble.querySelector('.streaming');
                if (streamEl) {
                    // Convert streaming text to final text (change color from gray to normal)
                    streamEl.className = '';
                    streamEl.style.color = '#e0e0e0';
                }
                currentAssistantBubble = null;
            }
        }

        function scrollChat() {
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        // ── Status toast ───────────────────────────────
        const activityEl = document.getElementById('activity-indicator');
        const activityIcons = { GENERAL: '🏠', COOKING: '🍳', UTILITIES: '⚙️', CHORES: '🧹', SYSTEM: '🖥️', ENTERTAINMENT: '🎵' };
        activityEl.innerHTML = '<span class="activity-icon">🏠</span>general';

        const toastEl = document.getElementById('status-toast');
        const toastText = toastEl.querySelector('.status-text');
        let toastHideTimer = null;

        socket.on('status_toast', (data) => {
            if (data.status === 'activity') {
                const name = data.activity || 'GENERAL';
                const icon = activityIcons[name] || '🏠';
                activityEl.innerHTML = '<span class="activity-icon">' + icon + '</span>' + name.toLowerCase();
                return;
            }
            handleStatusToast(data);
        });

        function handleStatusToast(data) {
            const status = data.status || 'idle';
            const message = data.message || status;
            if (toastHideTimer) { clearTimeout(toastHideTimer); toastHideTimer = null; }
            toastEl.className = 'visible status-' + status;
            toastEl.id = 'status-toast';
            toastText.textContent = message;
            if (status === 'idle') {
                toastHideTimer = setTimeout(() => toastEl.classList.remove('visible'), 2000);
            } else if (status === 'user_speech') {
                toastText.textContent = '\u201C' + message + '\u201D';
                toastHideTimer = setTimeout(() => toastEl.classList.remove('visible'), 5000);
            }
        }

        // ── Chat input ─────────────────────────────────
        const chatInput = document.getElementById('chat-input');
        function sendChatMessage() {
            const text = chatInput.value.trim();
            if (text) {
                socket.emit('user_message', { text: text });
                addBubble('user', text);  // render immediately (backend won't echo back for display input)
                chatInput.value = '';
            }
        }
        document.getElementById('chat-send').addEventListener('click', sendChatMessage);
        chatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendChatMessage(); });
        document.getElementById('chat-interrupt').addEventListener('click', () => socket.emit('interrupt'));

        function esc(str) {
            if (!str) return '';
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        // Start with idle view
        renderIdle();
    </script>
</body>
</html>
