<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ff6600">
    <title>GlaDOS Display</title>
    <link rel="manifest" href="/static/manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: #1a1a2e;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Header ────────────────────────────────────── */
        #app-header {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            background: #16162a;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            z-index: 20;
            min-height: 48px;
        }
        #back-btn {
            font-size: 1.2rem; color: #ff6600; background: none; border: none;
            cursor: pointer; padding: 4px 12px 4px 0; display: none;
        }
        #header-title { flex: 1; font-size: 1.1rem; font-weight: 600; }
        #status-dot {
            width: 10px; height: 10px; border-radius: 50%; background: #666;
            margin-right: 12px; transition: background 0.3s;
        }
        #status-dot.listening { background: #4caf50; animation: pulse 1.5s infinite; }
        #status-dot.thinking { background: #ff9800; animation: pulse 1s infinite; }
        #status-dot.speaking { background: #ff6600; animation: pulse 0.8s infinite; }
        #chat-toggle {
            font-size: 1.3rem; background: none; border: none; color: #aaa;
            cursor: pointer; padding: 4px 8px;
        }
        #chat-toggle:hover { color: #ff6600; }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* ── Mode banner ───────────────────────────────── */
        #mode-banner {
            display: none;
            padding: 8px 16px;
            background: rgba(255, 102, 0, 0.12);
            border-bottom: 1px solid rgba(255, 102, 0, 0.2);
            font-size: 0.85rem;
            color: #ff8c00;
            justify-content: space-between;
            align-items: center;
        }
        #mode-banner.visible { display: flex; }
        #mode-banner button {
            background: rgba(255,102,0,0.2); color: #ff6600; border: 1px solid rgba(255,102,0,0.3);
            padding: 4px 14px; border-radius: 6px; cursor: pointer; font-size: 0.8rem;
        }

        /* ── Main content area ─────────────────────────── */
        #main-content {
            flex: 1;
            overflow-y: auto;
            position: relative;
        }

        /* ── Dashboard ─────────────────────────────────── */
        .dashboard {
            padding: 24px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            max-width: 800px;
            margin: 0 auto;
        }
        .dash-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .dash-card:hover { border-color: rgba(255,102,0,0.3); }
        .dash-card-header {
            display: flex; align-items: center; gap: 8px;
            padding: 14px 16px 8px;
            cursor: pointer; font-weight: 600; font-size: 0.95rem;
        }
        .dash-card-header:hover { color: #ff6600; }
        .dash-card-icon { font-size: 1.3rem; }
        .dash-card-badge {
            margin-left: auto; font-size: 0.75rem; font-weight: 400;
            background: rgba(255,255,255,0.06); padding: 2px 10px; border-radius: 10px; color: #888;
        }
        .dash-card-badge.urgent { background: rgba(255,80,0,0.15); color: #ff6600; }
        .dash-card-body { padding: 0 16px 14px; font-size: 0.85rem; color: #888; }
        .dash-card-body .quick-input {
            display: flex; gap: 6px; margin-top: 8px;
        }
        .dash-card-body .quick-input input {
            flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; padding: 8px 10px; color: #e0e0e0; font-size: 0.85rem;
        }
        .dash-card-body .quick-input input:focus { border-color: #ff6600; outline: none; }
        .dash-card-body .quick-input button {
            background: #ff6600; color: #fff; border: none; padding: 8px 14px;
            border-radius: 8px; cursor: pointer; font-size: 0.9rem;
        }
        .dash-expiring-item { color: #ff8c00; font-size: 0.8rem; padding: 2px 0; }
        .dash-expiring-item.expired { color: #ff4444; }
        .dash-timer-countdown { font-size: 1.5rem; font-weight: 300; color: #ff6600; font-variant-numeric: tabular-nums; }
        .dash-clock {
            grid-column: 1 / -1;
            text-align: center; padding: 16px; color: #666; font-size: 0.9rem;
        }
        .dash-clock .time { font-size: 2.5rem; font-weight: 200; color: #e0e0e0; }

        /* ── Full-screen view container ────────────────── */
        #view-container { display: none; padding: 16px; }
        #view-container.active { display: block; }

        /* ── View shared styles ────────────────────────── */
        .view-title { font-size: 1.3rem; font-weight: 600; color: #ff6600; margin-bottom: 16px; border-bottom: 1px solid rgba(255,102,0,0.2); padding-bottom: 8px; }

        /* ── Recipe view ───────────────────────────────── */
        .recipe-image { width: 100%; max-height: 300px; object-fit: cover; border-radius: 12px; margin-bottom: 16px; }

        /* Recipe search results */
        .rs-list { display: flex; flex-direction: column; gap: 8px; }
        .rs-item {
            display: flex; align-items: center; gap: 14px; padding: 10px 12px;
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px; cursor: pointer; min-height: 64px;
            transition: border-color 0.15s;
        }
        .rs-item:hover { border-color: rgba(255,102,0,0.3); }
        .rs-item:active { background: rgba(255,102,0,0.08); }
        .rs-thumb { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
        .rs-thumb-placeholder {
            width: 56px; height: 56px; border-radius: 8px; flex-shrink: 0;
            background: rgba(255,255,255,0.04); display: flex; align-items: center;
            justify-content: center; font-size: 1.5rem;
        }
        .rs-info { flex: 1; min-width: 0; }
        .rs-title { font-size: 0.95rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .rs-meta { font-size: 0.75rem; color: #888; margin-top: 2px; }
        .recipe-section-label { font-size: 0.9rem; font-weight: 600; color: #ff6600; margin: 16px 0 8px; text-transform: uppercase; letter-spacing: 0.05em; }
        .ingredient-list { list-style: disc; padding-left: 24px; }
        .ingredient-list li { margin: 4px 0; color: #ccc; }
        .step-list { list-style: none; counter-reset: step; padding-left: 0; }
        .step-list li { counter-increment: step; margin: 12px 0; padding-left: 36px; position: relative; color: #ccc; line-height: 1.5; }
        .step-list li::before { content: counter(step); position: absolute; left: 0; width: 24px; height: 24px; background: #ff6600; color: #fff; border-radius: 50%; text-align: center; line-height: 24px; font-size: 0.8rem; font-weight: 600; }

        /* ── Shopping list view ─────────────────────────── */
        .shopping-add-form { display: flex; gap: 8px; margin-bottom: 12px; }
        .shopping-add-form input {
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; padding: 10px 12px; color: #e0e0e0; font-size: 0.9rem;
        }
        .shopping-add-form input:first-child { flex: 1; }
        .shopping-add-form input:nth-child(2) { width: 80px; }
        .shopping-add-form input:focus { border-color: #ff6600; outline: none; }
        .shopping-add-form button { background: #ff6600; color: #fff; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; }
        .shopping-category-header { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: #888; padding: 8px 0 4px; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .shopping-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 4px;
            border-bottom: 1px solid rgba(255,255,255,0.03); cursor: pointer; min-height: 48px;
        }
        .shopping-item:active { background: rgba(255,255,255,0.04); }
        .shopping-item.got { opacity: 0.4; }
        .shopping-item.got .si-name { text-decoration: line-through; }
        .si-check {
            width: 26px; height: 26px; border: 2px solid #555; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .shopping-item.got .si-check { background: #ff6600; border-color: #ff6600; }
        .si-check::after { content: ''; display: none; width: 7px; height: 12px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); margin-bottom: 2px; }
        .shopping-item.got .si-check::after { display: block; }
        .si-name { flex: 1; font-size: 0.95rem; }
        .si-qty { font-size: 0.8rem; color: #aaa; background: rgba(255,255,255,0.06); padding: 2px 10px; border-radius: 10px; }
        .si-recurring {
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px; color: #888; font-size: 0.7rem; padding: 1px 2px; cursor: pointer; color-scheme: dark;
        }
        .si-recurring.active { color: #ff6600; border-color: rgba(255,102,0,0.3); }
        .si-edit { font-size: 0.8rem; color: #555; background: none; border: none; cursor: pointer; padding: 8px; min-width: 36px; }
        .si-edit:hover { color: #ff6600; }
        .si-remove { font-size: 1rem; color: #555; background: none; border: none; cursor: pointer; padding: 8px; min-width: 40px; min-height: 40px; }
        .si-remove:hover { color: #e55; }
        .shopping-footer { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.06); margin-top: 8px; }
        .shopping-footer .progress { font-size: 0.9rem; color: #888; }
        .btn-primary { background: #ff6600; color: #fff; border: none; padding: 10px 24px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; min-height: 44px; }
        .btn-primary:disabled { opacity: 0.4; }

        /* ── Pantry view ───────────────────────────────── */
        .pantry-expiry-banner { background: rgba(255,80,0,0.12); border: 1px solid rgba(255,80,0,0.25); border-radius: 10px; padding: 10px 16px; margin-bottom: 16px; font-size: 0.85rem; }
        .pantry-expiry-banner-title { color: #ff6600; font-weight: 600; margin-bottom: 4px; }
        .pantry-location { margin-bottom: 12px; background: rgba(255,255,255,0.02); border-radius: 10px; overflow: hidden; }
        .pantry-loc-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; cursor: pointer; background: rgba(255,255,255,0.04); min-height: 48px; }
        .pantry-loc-header:hover { background: rgba(255,255,255,0.06); }
        .pantry-loc-name { font-size: 0.95rem; font-weight: 500; }
        .pantry-loc-count { font-size: 0.75rem; color: #888; background: rgba(255,255,255,0.06); padding: 2px 8px; border-radius: 8px; }
        .pantry-loc-items { padding: 0 16px; display: none; }
        .pantry-location.expanded .pantry-loc-items { display: block; }
        .pantry-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 0.9rem; min-height: 44px; }
        .pantry-item:last-child { border-bottom: none; }
        .pi-name { flex: 1; }
        .pi-notes { font-size: 0.75rem; color: #888; }
        .pi-expiry { font-size: 0.75rem; padding: 2px 8px; border-radius: 8px; }
        .pi-expiry.expired { color: #ff4444; background: rgba(255,68,68,0.12); }
        .pi-expiry.expiring-soon { color: #ff8800; background: rgba(255,136,0,0.12); }
        .pi-expiry.expiring-week { color: #ffcc00; background: rgba(255,204,0,0.10); }
        .pi-expiry.ok { color: #66bb6a; background: rgba(102,187,106,0.10); }
        .pantry-expiry-picker { background: transparent; border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; color: inherit; font-size: 0.7rem; padding: 1px 4px; width: 110px; color-scheme: dark; cursor: pointer; }
        .pantry-expiry-picker.empty { width: 28px; opacity: 0.5; }
        .pantry-expiry-picker:hover { border-color: #ff6600; }
        .pi-remove { font-size: 0.9rem; color: #555; background: none; border: none; cursor: pointer; padding: 8px; min-width: 40px; min-height: 40px; }
        .pi-remove:hover { color: #e55; }
        .pantry-empty { color: #555; font-style: italic; padding: 8px 0; font-size: 0.85rem; }
        .pantry-add-item { display: flex; gap: 6px; padding: 8px 0; border-top: 1px solid rgba(255,255,255,0.04); }
        .pantry-add-item input { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 8px; color: #e0e0e0; font-size: 0.85rem; }
        .pantry-add-item input:first-child { flex: 1; }
        .pantry-add-item input:focus { border-color: #ff6600; outline: none; }
        .pantry-add-item input[type="date"] { color-scheme: dark; width: 130px; }
        .pantry-add-item button { background: #ff6600; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; }
        .pantry-add-loc { display: flex; gap: 8px; padding: 12px 0; margin-top: 8px; border-top: 1px solid rgba(255,255,255,0.06); }
        .pantry-add-loc input { flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 8px 12px; color: #e0e0e0; font-size: 0.85rem; }
        .pantry-add-loc input:focus { border-color: #ff6600; outline: none; }
        .pantry-add-loc button { background: #ff6600; color: #fff; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; }

        /* ── Timer overlay ─────────────────────────────── */
        #timer-overlay {
            position: fixed; bottom: 16px; right: 16px; z-index: 50;
            display: none; flex-direction: column; gap: 8px; pointer-events: none;
        }
        #timer-overlay.visible { display: flex; }
        .timer-float {
            background: rgba(20,20,40,0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,102,0,0.2); border-radius: 12px;
            padding: 12px 20px; text-align: center; min-width: 180px; pointer-events: auto;
        }
        .timer-float .tf-icon { font-size: 1.1rem; }
        .timer-float .tf-name { font-size: 0.85rem; color: #aaa; }
        .timer-float .tf-time { font-size: 2rem; font-weight: 300; color: #ff6600; font-variant-numeric: tabular-nums; }

        /* ── Chat drawer ───────────────────────────────── */
        #chat-backdrop {
            position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 90;
            display: none; cursor: pointer;
        }
        #chat-backdrop.visible { display: block; }
        #chat-drawer {
            position: fixed; top: 0; right: -400px; bottom: 0; width: 380px;
            background: #16162a; border-left: 1px solid rgba(255,255,255,0.08);
            z-index: 100; display: flex; flex-direction: column;
            transition: right 0.25s ease;
        }
        #chat-drawer.open { right: 0; }
        #chat-drawer-header {
            padding: 12px 16px; display: flex; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.08); min-height: 48px;
        }
        #chat-drawer-header h2 { flex: 1; font-size: 1rem; font-weight: 600; }
        #chat-close { font-size: 1.2rem; background: none; border: none; color: #888; cursor: pointer; padding: 8px; }
        #chat-history {
            flex: 1; overflow-y: auto; padding: 12px;
            display: flex; flex-direction: column; gap: 10px;
        }
        #chat-history::before { content: ''; flex: 1; }
        .chat-bubble { max-width: 90%; padding: 8px 12px; border-radius: 12px; font-size: 0.88rem; line-height: 1.4; word-wrap: break-word; overflow-wrap: break-word; }
        .chat-bubble.user { align-self: flex-end; background: #2a3a5c; border-bottom-right-radius: 4px; color: #c8d8f8; }
        .chat-bubble.assistant { align-self: flex-start; background: #2a2a3e; border-bottom-left-radius: 4px; }
        .chat-bubble.assistant .streaming { color: #888; }
        .bubble-time { font-size: 0.6rem; color: #555; margin-top: 4px; }
        .bubble-no-sources { font-size: 0.6rem; color: #555; font-style: italic; margin-top: 2px; }
        .chat-bubble.collapsible { padding: 2px 0; overflow: hidden; margin: 4px 0; }
        .bubble-header { padding: 8px 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 0.78rem; user-select: none; }
        .bubble-header:hover { filter: brightness(1.2); }
        .bubble-header .toggle { font-size: 0.7rem; transition: transform 0.2s; margin-left: 8px; }
        .collapsible.expanded .toggle { transform: rotate(90deg); }
        .bubble-content { max-height: 0; overflow: hidden; transition: max-height 0.3s; padding: 0 12px; font-size: 0.78rem; color: #aaa; white-space: pre-wrap; }
        .collapsible.expanded .bubble-content { max-height: 500px; overflow-y: auto; padding: 6px 12px 10px; }
        .chat-bubble.knowledge { background: rgba(76,175,80,0.1); border-left: 3px solid #4caf50; }
        .chat-bubble.knowledge .bubble-header { color: #81c784; }
        .chat-bubble.thinking { background: rgba(156,39,176,0.1); border-left: 3px solid #9c27b0; }
        .chat-bubble.thinking .bubble-header { color: #ce93d8; }
        .chat-bubble.tool-call { background: rgba(33,150,243,0.1); border-left: 3px solid #2196f3; }
        .chat-bubble.tool-call .bubble-header { color: #64b5f6; }
        .chat-bubble.nlp-tool { background: rgba(0,188,212,0.1); border-left: 3px solid #00bcd4; }
        .chat-bubble.nlp-tool .bubble-header { color: #4dd0e1; }
        .chat-bubble.tool-result { background: rgba(33,150,243,0.05); border-left: 3px solid rgba(33,150,243,0.3); }
        .chat-bubble.tool-result .bubble-header { color: #90caf9; font-size: 0.73rem; }
        .chat-bubble.async-event { background: rgba(255,193,7,0.1); border-left: 3px solid #ffc107; }
        .chat-bubble.async-event .bubble-header { color: #ffd54f; }
        #chat-input-bar {
            display: flex; gap: 6px; padding: 10px 12px;
            background: rgba(0,0,0,0.3); border-top: 1px solid rgba(255,102,0,0.3);
        }
        #chat-input {
            flex: 1; padding: 10px 12px; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; background: rgba(255,255,255,0.05); color: #e0e0e0; font-size: 0.9rem; outline: none;
        }
        #chat-input:focus { border-color: #ff6600; }
        #chat-send { padding: 10px 16px; background: #ff6600; color: white; border: none; border-radius: 8px; cursor: pointer; min-height: 44px; }
        #chat-interrupt { padding: 10px 12px; background: rgba(244,67,54,0.15); color: #f44336; border: 1px solid rgba(244,67,54,0.4); border-radius: 8px; cursor: pointer; min-height: 44px; }

        /* ── Status toast ──────────────────────────────── */
        #status-toast {
            position: fixed; bottom: 15%; left: 50%; transform: translateX(-50%);
            padding: 16px 28px; border-radius: 14px; background: rgba(20,20,40,0.9);
            backdrop-filter: blur(12px); font-size: 1.2rem; max-width: 80%; text-align: center;
            opacity: 0; transition: opacity 0.3s; z-index: 80; border: 1px solid rgba(255,102,0,0.15);
        }
        #status-toast.visible { opacity: 1; }
        .status-speaking { color: #ff8c00; }

        /* ── Mobile bottom nav ─────────────────────────── */
        #bottom-nav {
            display: none;
            background: #16162a; border-top: 1px solid rgba(255,255,255,0.08);
            padding: 6px 0; padding-bottom: max(6px, env(safe-area-inset-bottom));
        }
        #bottom-nav .nav-items { display: flex; justify-content: space-around; }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 2px;
            color: #888; font-size: 0.65rem; cursor: pointer; padding: 4px 16px;
            border: none; background: none;
        }
        .nav-item.active { color: #ff6600; }
        .nav-item .nav-icon { font-size: 1.2rem; }

        /* ── Responsive ────────────────────────────────── */
        @media (max-width: 768px) {
            .dashboard { grid-template-columns: 1fr; padding: 16px; gap: 12px; }
            #chat-drawer { width: 85vw; right: -85vw; }
            #chat-drawer.open { right: 0; }
            #bottom-nav { display: block; }
            #timer-overlay { bottom: 70px; right: 12px; }
            .timer-float { min-width: 140px; padding: 8px 14px; }
            .timer-float .tf-time { font-size: 1.5rem; }
        }

        /* ── Info view ─────────────────────────────────── */
        .info-content { font-size: 1rem; color: #ccc; white-space: pre-wrap; line-height: 1.6; }

        /* ── Utility ───────────────────────────────────── */
        @keyframes flash { 0%, 100% { background: #1a1a2e; } 50% { background: #4a1a1a; } }
        .flash-alert { animation: flash 0.5s ease-in-out 6; }
    </style>
</head>
<body>
    <!-- Header -->
    <div id="app-header">
        <button id="back-btn" onclick="goBack()">&#8592;</button>
        <div id="header-title">GlaDOS</div>
        <div id="status-dot"></div>
        <button id="chat-toggle" onclick="toggleChat()">&#9776;</button>
    </div>

    <!-- Mode banner (planning / post-shopping) -->
    <div id="mode-banner">
        <span id="mode-banner-text"></span>
        <button onclick="socket.emit('shopping_list_action', {action:'exit_mode'})">Exit</button>
    </div>

    <!-- Main content -->
    <div id="main-content">
        <div id="dashboard"></div>
        <div id="view-container"></div>
    </div>

    <!-- Timer overlay -->
    <div id="timer-overlay"></div>

    <!-- Status toast -->
    <div id="status-toast"><span class="status-text"></span></div>

    <!-- Chat drawer -->
    <div id="chat-backdrop" onclick="toggleChat()"></div>
    <div id="chat-drawer">
        <div id="chat-drawer-header">
            <h2>Chat</h2>
            <div id="connection-status" style="font-size:0.75rem; color:#4caf50; margin-right:8px;">connected</div>
            <button id="chat-close" onclick="toggleChat()">&#10005;</button>
        </div>
        <div id="chat-history"></div>
        <div id="chat-input-bar">
            <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off" />
            <button id="chat-send" onclick="sendChat()">Send</button>
            <button id="chat-interrupt" onclick="socket.emit('interrupt')">Stop</button>
        </div>
    </div>

    <!-- Mobile bottom nav -->
    <div id="bottom-nav">
        <div class="nav-items">
            <button class="nav-item active" onclick="viewHistory=[];navigateTo('dashboard')"><span class="nav-icon">&#127968;</span>Home</button>
            <button class="nav-item" onclick="socket.emit('shopping_list_action',{action:'show'})"><span class="nav-icon">&#128722;</span>List</button>
            <button class="nav-item" onclick="socket.emit('pantry_action',{action:'show'})"><span class="nav-icon">&#127968;</span>Pantry</button>
            <button class="nav-item" onclick="toggleChat()"><span class="nav-icon">&#128172;</span>Chat</button>
        </div>
    </div>

    <script src="/static/socket.io.min.js"></script>
    <script>
        // ── State ──────────────────────────────────────
        const dashboard = document.getElementById('dashboard');
        const viewContainer = document.getElementById('view-container');
        const chatHistory = document.getElementById('chat-history');
        const statusEl = document.getElementById('connection-status');
        const timerOverlay = document.getElementById('timer-overlay');
        let currentView = 'dashboard';
        let viewHistory = []; // navigation stack for back button
        let currentAssistantBubble = null;
        let clockInterval = null;
        let dashboardData = { shopping: {count:0,got:0}, pantry: {count:0,expiring:[]}, timers: {active:0}, recipes: {count:0} };

        // ── SocketIO ───────────────────────────────────
        const socket = io({ reconnection: true, reconnectionDelay: 1000, reconnectionAttempts: Infinity, transports: ['websocket', 'polling'] });
        socket.on('connect', () => { statusEl.textContent = 'connected'; statusEl.style.color = '#4caf50'; requestDashboardData(); });
        socket.on('disconnect', () => { statusEl.textContent = 'reconnecting...'; statusEl.style.color = '#f44336'; });

        function requestDashboardData() {
            socket.emit('shopping_list_action', { action: 'get_state' });
            socket.emit('pantry_action', { action: 'get_summary' });
        }

        // ── Navigation ─────────────────────────────────
        function goBack() {
            if (viewHistory.length > 0) {
                const prev = viewHistory.pop();
                navigateTo(prev, true);
            } else {
                navigateTo('dashboard', true);
            }
        }
        function navigateTo(view, isBack) {
            if (!isBack && currentView !== view) {
                viewHistory.push(currentView);
                // Keep history reasonable
                if (viewHistory.length > 10) viewHistory.shift();
            }
            currentView = view;
            const backBtn = document.getElementById('back-btn');
            const title = document.getElementById('header-title');
            // Update bottom nav active state
            document.querySelectorAll('.nav-item').forEach((el, i) => el.classList.toggle('active', i === 0 && view === 'dashboard'));

            if (view === 'dashboard') {
                dashboard.style.display = '';
                viewContainer.style.display = 'none';
                viewContainer.classList.remove('active');
                backBtn.style.display = 'none';
                title.textContent = 'GlaDOS';
                renderDashboard();
            } else {
                dashboard.style.display = 'none';
                viewContainer.style.display = 'block';
                viewContainer.classList.add('active');
                backBtn.style.display = 'inline-block';
                const titles = { shopping_list: 'Shopping List', pantry: 'Pantry', recipe: 'Recipe', recipe_search: 'Recipes', info: 'Information', timer: 'Timers' };
                title.textContent = titles[view] || 'GlaDOS';
            }
        }

        // ── Display updates ────────────────────────────
        socket.on('display_update', (data) => {
            if (clockInterval) { clearInterval(clockInterval); clockInterval = null; }
            const vt = data.view_type || 'idle';

            if (vt === 'timer') { renderTimerOverlay(data); return; }
            timerOverlay.classList.remove('visible'); timerOverlay.innerHTML = '';

            if (vt === 'dashboard_data') { updateDashboardData(data); return; }
            if (vt === 'idle') { navigateTo('dashboard'); return; }

            // Full-screen views
            if (vt === 'shopping_list') { navigateTo('shopping_list'); renderShoppingList(data); }
            else if (vt === 'pantry') { navigateTo('pantry'); renderPantry(data); }
            else if (vt === 'recipe') { navigateTo('recipe'); renderRecipe(data); }
            else if (vt === 'recipe_search') { navigateTo('recipe_search'); renderRecipeSearch(data); }
            else if (vt === 'info') { navigateTo('info'); renderInfo(data); }
            else { navigateTo('dashboard'); }

            if (data.alert) { document.body.classList.add('flash-alert'); setTimeout(() => document.body.classList.remove('flash-alert'), 3000); }
        });

        // ── Dashboard ──────────────────────────────────
        function updateDashboardData(data) {
            if (data.shopping) dashboardData.shopping = data.shopping;
            if (data.pantry) dashboardData.pantry = data.pantry;
            if (data.timers) dashboardData.timers = data.timers;
            if (data.recipes) dashboardData.recipes = data.recipes;
            // Also update from shopping_list view_type
            if (data.view_type === 'shopping_list' && data.items) {
                dashboardData.shopping = { count: data.items.length, got: data.items.filter(i => i.got).length };
            }
            if (currentView === 'dashboard') renderDashboard();
        }

        function renderDashboard() {
            const d = dashboardData;
            const expList = (d.pantry.expiring || []).slice(0, 3).map(e => {
                const cls = e.days_left <= 0 ? ' expired' : '';
                const label = e.days_left <= 0 ? 'expired' : e.days_left === 1 ? 'tomorrow' : e.days_left + 'd';
                return `<div class="dash-expiring-item${cls}">${esc(e.name)} — ${label}</div>`;
            }).join('');

            const now = new Date();
            const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const date = now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });

            dashboard.innerHTML = `<div class="dashboard">
                <div class="dash-card">
                    <div class="dash-card-header" onclick="socket.emit('shopping_list_action',{action:'show'})">
                        <span class="dash-card-icon">&#128722;</span> Shopping
                        <span class="dash-card-badge">${d.shopping.count || 0}</span>
                    </div>
                    <div class="dash-card-body">
                        ${d.shopping.count ? d.shopping.got + ' of ' + d.shopping.count + ' got' : 'List is empty'}
                        <div class="quick-input">
                            <input type="text" id="dash-add-item" placeholder="Quick add..." onkeydown="if(event.key==='Enter') dashAddItem()">
                            <button onclick="dashAddItem()">+</button>
                        </div>
                    </div>
                </div>
                <div class="dash-card">
                    <div class="dash-card-header" onclick="socket.emit('pantry_action',{action:'show'})">
                        <span class="dash-card-icon">&#127968;</span> Pantry
                        <span class="dash-card-badge${(d.pantry.expiring||[]).length ? ' urgent' : ''}">${d.pantry.count || 0}</span>
                    </div>
                    <div class="dash-card-body">
                        ${expList || '<span style="color:#555">Nothing expiring</span>'}
                    </div>
                </div>
                <div class="dash-card">
                    <div class="dash-card-header">
                        <span class="dash-card-icon">&#127859;</span> Recipes
                        <span class="dash-card-badge">${d.recipes.count || '...'}</span>
                    </div>
                    <div class="dash-card-body">
                        <div class="quick-input">
                            <input type="text" id="dash-recipe-search" placeholder="Search recipes..." onkeydown="if(event.key==='Enter') dashSearchRecipe()">
                            <button onclick="dashSearchRecipe()">&#128269;</button>
                        </div>
                        <div style="margin-top:4px;display:flex;align-items:center;gap:6px">
                            <input type="checkbox" id="dash-recipe-pantry-filter" style="accent-color:#ff6600">
                            <label for="dash-recipe-pantry-filter" style="font-size:0.75rem;color:#888;cursor:pointer">Only makeable from pantry</label>
                        </div>
                    </div>
                </div>
                <div class="dash-card">
                    <div class="dash-card-header">
                        <span class="dash-card-icon">&#9201;</span> Timers
                    </div>
                    <div class="dash-card-body" id="dash-timers">
                        <span style="color:#555">None active</span>
                    </div>
                </div>
                <div class="dash-clock"><div class="time">${time}</div>${date}</div>
            </div>`;
            if (!clockInterval) {
                clockInterval = setInterval(() => {
                    const el = dashboard.querySelector('.dash-clock .time');
                    if (el) el.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                }, 1000);
            }
        }

        function dashAddItem() {
            const el = document.getElementById('dash-add-item');
            if (el && el.value.trim()) {
                socket.emit('shopping_list_action', { action: 'add_item', name: el.value.trim() });
                el.value = '';
            }
        }
        function dashSearchRecipe() {
            const el = document.getElementById('dash-recipe-search');
            const pantryFilter = document.getElementById('dash-recipe-pantry-filter');
            if (el && el.value.trim()) {
                const query = el.value.trim();
                if (pantryFilter && pantryFilter.checked) {
                    socket.emit('user_message', { text: 'what can I make with what is in the pantry that is like ' + query });
                } else {
                    socket.emit('user_message', { text: 'search recipes for ' + query });
                }
                el.value = '';
            }
        }

        // ── View renderers ─────────────────────────────

        function renderRecipe(data) {
            const title = data.title || 'Recipe';
            let img = '';
            if (data.image_name) img = `<img class="recipe-image" src="/recipe-images/${encodeURIComponent(data.image_name)}.jpg" onerror="this.style.display='none'" alt="${esc(title)}">`;
            const safeTitle = esc(title).replace(/'/g, "\\'");
            const actions = `<div style="display:flex;gap:8px;margin:12px 0">
                <button class="btn-primary" style="font-size:0.85rem;padding:8px 16px" onclick="socket.emit('pantry_action',{action:'check_recipe',recipe_name:'${safeTitle}'})">Check Pantry</button>
                <button class="btn-primary" style="font-size:0.85rem;padding:8px 16px;background:#2a3a5c" onclick="socket.emit('pantry_action',{action:'add_recipe_to_list',recipe_name:'${safeTitle}'})">Add Missing to List</button>
            </div>`;
            if (data.ingredients && data.directions) {
                const ings = (Array.isArray(data.ingredients) ? data.ingredients : data.ingredients.split('\n')).map(i => i.replace(/^[-\s]*/, '').trim()).filter(Boolean).map(i => `<li>${esc(i)}</li>`).join('');
                const steps = (Array.isArray(data.directions) ? data.directions : data.directions.split('\n')).map(s => s.replace(/^(Step\s*\d+[:\s]*)/i, '').trim()).filter(Boolean).map(s => `<li>${esc(s)}</li>`).join('');
                viewContainer.innerHTML = `${img}<div class="view-title">${esc(title)}</div>${actions}<div class="recipe-section-label">Ingredients</div><ul class="ingredient-list">${ings}</ul><div class="recipe-section-label">Directions</div><ol class="step-list">${steps}</ol>`;
            } else {
                viewContainer.innerHTML = `${img}<div class="view-title">${esc(title)}</div>${actions}<div class="info-content">${esc(data.content || '')}</div>`;
            }
        }

        function renderRecipeSearch(data) {
            const results = data.results || [];
            const query = data.query || '';
            if (!results.length) {
                viewContainer.innerHTML = `<div class="view-title">No recipes found for "${esc(query)}"</div>`;
                return;
            }
            const items = results.map(r => {
                const img = r.image_name
                    ? `<img class="rs-thumb" src="/recipe-images/${encodeURIComponent(r.image_name)}.jpg" onerror="this.style.display='none'">`
                    : '<div class="rs-thumb-placeholder">&#127859;</div>';
                return `<div class="rs-item" onclick="socket.emit('user_message',{text:'select recipe ${esc(r.title).replace(/'/g, "\\'")}'})">
                    ${img}
                    <div class="rs-info">
                        <div class="rs-title">${esc(r.title)}</div>
                        <div class="rs-meta">${r.ingredient_count || '?'} ingredients</div>
                    </div>
                </div>`;
            }).join('');
            viewContainer.innerHTML = `<div class="view-title">${esc(data.title || 'Recipe Search')}</div><div class="rs-list">${items}</div>`;
        }

        function renderShoppingList(data) {
            const items = data.items || [];
            const total = items.length;
            const gotCount = items.filter(i => i.got).length;
            // Update dashboard data
            dashboardData.shopping = { count: total, got: gotCount };

            let addForm = `<div class="shopping-add-form">
                <input type="text" id="sl-add-name" placeholder="Add item..." onkeydown="if(event.key==='Enter') slAddItem()">
                <input type="text" id="sl-add-qty" placeholder="Qty" style="width:80px" onkeydown="if(event.key==='Enter') slAddItem()">
                <button onclick="slAddItem()">Add</button>
            </div>`;
            if (!total) { viewContainer.innerHTML = `${addForm}<div style="text-align:center;color:#555;padding:40px">Shopping list is empty</div>`; return; }

            const catOrder = ['dairy','produce','meat','seafood','bakery','frozen','dry_goods','beverages','condiments','snacks','other'];
            const catLabels = {dairy:'Dairy & Eggs',produce:'Produce',meat:'Meat',seafood:'Seafood',bakery:'Bakery',frozen:'Frozen',dry_goods:'Dry Goods',beverages:'Beverages',condiments:'Condiments',snacks:'Snacks',other:'Other'};
            const groups = {};
            items.forEach(i => { const c = i.category||'other'; if(!groups[c]) groups[c]=[]; groups[c].push(i); });

            let html = '';
            catOrder.forEach(cat => {
                if (!groups[cat]) return;
                html += `<div class="shopping-category-header">${esc(catLabels[cat]||cat)}</div>`;
                groups[cat].sort((a,b) => a.name.localeCompare(b.name));
                groups[cat].forEach(item => {
                    const gc = item.got ? ' got' : '';
                    const qty = item.quantity ? `<span class="si-qty">${esc(item.quantity)}</span>` : '';
                    const rOpts = [0,3,7,10,14,30].map(d => `<option value="${d}"${(item.recurring_days||0)===d?' selected':''}>${d?d+'d':'Off'}</option>`).join('');
                    const rec = `<select class="si-recurring${item.recurring?' active':''}" onclick="event.stopPropagation()" onchange="socket.emit('shopping_list_action',{action:'set_recurring',item_id:'${item.id}',interval_days:parseInt(this.value)||0})">${rOpts}</select>`;
                    html += `<div class="shopping-item${gc}" onclick="socket.emit('shopping_list_action',{action:'toggle',item_id:'${item.id}'})">
                        <div class="si-check"></div><span class="si-name">${esc(item.name)}</span>${qty}${rec}
                        <button class="si-edit" onclick="event.stopPropagation();slEditItem('${item.id}','${esc(item.name).replace(/'/g,"\\'")}','${esc(item.quantity||'').replace(/'/g,"\\'")}')" title="Edit">&#9998;</button>
                        <button class="si-remove" onclick="event.stopPropagation();socket.emit('shopping_list_action',{action:'remove',item_id:'${item.id}'})" title="Remove">&#10005;</button>
                    </div>`;
                });
            });

            viewContainer.innerHTML = `${addForm}${html}
                <div class="shopping-footer">
                    <span class="progress">${gotCount} of ${total} items</span>
                    ${gotCount > 0 ? '<button class="btn-primary" onclick="socket.emit(\'shopping_list_action\',{action:\'complete\'})">Done Shopping</button>' : ''}
                </div>`;
        }
        function slAddItem() {
            const n = document.getElementById('sl-add-name'), q = document.getElementById('sl-add-qty');
            if (n && n.value.trim()) { socket.emit('shopping_list_action', { action:'add_item', name:n.value.trim(), quantity:q?q.value.trim():'' }); n.value=''; if(q) q.value=''; }
        }
        function slEditItem(id, name, qty) {
            const newName = prompt('Item name:', name);
            if (newName === null) return;
            const newQty = prompt('Quantity (or leave blank):', qty);
            if (newQty === null) return;
            socket.emit('shopping_list_action', {
                action: 'edit_item',
                item_id: id,
                name: newName.trim(),
                quantity: newQty.trim(),
            });
        }

        function renderPantry(data) {
            const locations = data.locations || [];
            const expiring = data.expiring_soon || [];
            let html = '';
            if (expiring.length) {
                html += `<div class="pantry-expiry-banner"><div class="pantry-expiry-banner-title">&#9888; Expiring Soon</div>${expiring.map(i => {
                    const l = i.days_left<0?'expired':i.days_left===0?'today':i.days_left===1?'tomorrow':`in ${i.days_left} days`;
                    return `<div>${esc(i.name)} (${esc(i.location)}) — ${l}</div>`;
                }).join('')}</div>`;
            }
            // Update dashboard
            dashboardData.pantry = { count: locations.reduce((s,l)=>s+l.items.length, 0), expiring: expiring };

            locations.forEach((loc, idx) => {
                const exp = idx === 0 || loc.items.length > 0 ? ' expanded' : '';
                let itemsHtml = '';
                if (!loc.items.length) { itemsHtml = '<div class="pantry-empty">Empty</div>'; }
                else {
                    loc.items.forEach(item => {
                        const notes = item.notes ? `<span class="pi-notes">${esc(item.notes)}</span>` : '';
                        let expHtml = '';
                        if (item.expires) {
                            const ed = new Date(item.expires+'T00:00:00'), td = new Date(); td.setHours(0,0,0,0);
                            const dl = Math.floor((ed-td)/86400000);
                            let cls = 'ok'; if(dl<=0) cls='expired'; else if(dl<=3) cls='expiring-soon'; else if(dl<=7) cls='expiring-week';
                            const rl = dl<0?'expired':dl===0?'today':dl===1?'tomorrow':dl+'d';
                            expHtml = `<span class="pi-expiry ${cls}">${rl} <input type="date" class="pantry-expiry-picker" value="${item.expires}" onchange="socket.emit('pantry_action',{action:'set_expiry',item_id:'${item.id}',expires:this.value})" onclick="event.stopPropagation()"></span>`;
                        } else {
                            expHtml = `<span><input type="date" class="pantry-expiry-picker empty" onchange="socket.emit('pantry_action',{action:'set_expiry',item_id:'${item.id}',expires:this.value})" onclick="event.stopPropagation()" title="Set expiry"></span>`;
                        }
                        itemsHtml += `<div class="pantry-item"><span class="pi-name">${esc(item.name)}</span>${notes}${expHtml}<button class="si-edit" onclick="paEditItem('${item.id}','${esc(item.name).replace(/'/g,"\\'")}','${esc(item.notes||'').replace(/'/g,"\\'")}')" title="Edit">&#9998;</button><button class="pi-remove" onclick="socket.emit('pantry_action',{action:'remove_item',item_id:'${item.id}'})" title="Remove">&#10005;</button></div>`;
                    });
                }
                const addHtml = `<div class="pantry-add-item">
                    <input type="text" placeholder="Add item..." id="pa-n-${loc.id}" onkeydown="if(event.key==='Enter')paAdd('${loc.id}')">
                    <input type="text" placeholder="Notes" style="width:80px" id="pa-t-${loc.id}" onkeydown="if(event.key==='Enter')paAdd('${loc.id}')">
                    <input type="date" id="pa-e-${loc.id}" style="width:130px" title="Expiry">
                    <button onclick="paAdd('${loc.id}')">+</button>
                </div>`;
                html += `<div class="pantry-location${exp}">
                    <div class="pantry-loc-header" onclick="this.parentElement.classList.toggle('expanded')"><span class="pantry-loc-name">${esc(loc.name)}</span><span class="pantry-loc-count">${loc.items.length}</span></div>
                    <div class="pantry-loc-items">${itemsHtml}${addHtml}</div>
                </div>`;
            });
            html += `<div class="pantry-add-loc"><input type="text" id="pa-new-loc" placeholder="New location..." onkeydown="if(event.key==='Enter')paAddLoc()"><button onclick="paAddLoc()">Add</button></div>`;
            viewContainer.innerHTML = html;
        }
        function paAdd(lid) {
            const n=document.getElementById('pa-n-'+lid), t=document.getElementById('pa-t-'+lid), e=document.getElementById('pa-e-'+lid);
            if(n&&n.value.trim()) { socket.emit('pantry_action',{action:'add_item',location_id:lid,name:n.value.trim(),notes:t?t.value.trim():'',expires:e?e.value:''}); n.value=''; if(t)t.value=''; if(e)e.value=''; }
        }
        function paAddLoc() { const el=document.getElementById('pa-new-loc'); if(el&&el.value.trim()){socket.emit('pantry_action',{action:'add_location',name:el.value.trim()});el.value='';} }
        function paEditItem(id, name, notes) {
            const newName = prompt('Item name:', name);
            if (newName === null) return;
            const newNotes = prompt('Notes (or leave blank):', notes);
            if (newNotes === null) return;
            socket.emit('pantry_action', { action: 'edit_item', item_id: id, name: newName.trim(), notes: newNotes.trim() });
        }

        function renderTimerOverlay(data) {
            if (data.timers && data.timers.length > 0) {
                timerOverlay.innerHTML = data.timers.map(t => {
                    const icon = t.type === 'alarm' ? '&#9200;' : '&#9201;';
                    return `<div class="timer-float"><div class="tf-icon">${icon}</div><div class="tf-name">${esc(t.description||'Timer')}</div><div class="tf-time">${esc(t.expires_in||'--')}</div></div>`;
                }).join('');
                timerOverlay.classList.add('visible');
            } else { timerOverlay.classList.remove('visible'); timerOverlay.innerHTML = ''; }
        }

        function renderInfo(data) {
            viewContainer.innerHTML = `<div class="view-title">${esc(data.title||'Information')}</div><div class="info-content">${esc(data.content||'')}</div>`;
        }

        // ── Chat ───────────────────────────────────────
        function toggleChat() {
            const d = document.getElementById('chat-drawer'), b = document.getElementById('chat-backdrop');
            const open = d.classList.toggle('open');
            b.classList.toggle('visible', open);
            if (open) document.getElementById('chat-input').focus();
        }
        function sendChat() {
            const el = document.getElementById('chat-input');
            const text = el.value.trim();
            if (text) { socket.emit('user_message', { text }); addBubble('user', text); el.value = ''; }
        }
        document.getElementById('chat-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });

        let lastResponseHadKnowledge = false;
        let lastResponseHadTool = false;

        socket.on('chat_message', (data) => {
            const role = data.role || 'system';
            if (role === 'user') { finalizeStreaming(); addBubble('user', data.content); lastResponseHadKnowledge = false; lastResponseHadTool = false; }
            else if (role === 'assistant_start') { finalizeStreaming(); currentAssistantBubble = addBubble('assistant', '', true); }
            else if (role === 'assistant_token') {
                if (!currentAssistantBubble) currentAssistantBubble = addBubble('assistant', '', true);
                const s = currentAssistantBubble.querySelector('.streaming'); if (s) s.textContent += data.token; scrollChat();
            }
            else if (role === 'assistant_end') {
                if (data.content) { if (!currentAssistantBubble) currentAssistantBubble = addBubble('assistant','',true); const s=currentAssistantBubble.querySelector('.streaming'); if(s) s.textContent=data.content; }
                if (!lastResponseHadKnowledge && !lastResponseHadTool && currentAssistantBubble) { const b=document.createElement('div'); b.className='bubble-no-sources'; b.textContent='answered from model \u2014 no knowledge base sources'; currentAssistantBubble.appendChild(b); }
                lastResponseHadKnowledge=false; lastResponseHadTool=false; finalizeStreaming();
            }
            else if (role === 'spoken') {}
            else if (role === 'knowledge_miss') { lastResponseHadKnowledge=false; }
            else if (role === 'knowledge') { lastResponseHadKnowledge=true; finalizeStreaming(); const src=(data.sources||[]).map(s=>s.title||s.source||'?').join(', '); addCollapsibleBubble('knowledge', src?`&#128218; Knowledge: ${src}`:'&#128218; Knowledge', null, data.content); }
            else if (role === 'thinking') { addCollapsibleBubble('thinking', '&#128173; Thinking', null, data.content); }
            else if (role === 'tool_call') { lastResponseHadTool=true; finalizeStreaming(); const i=data.via==='nlp'?'&#9889;':'&#128295;'; const v=data.via==='nlp'?' (NLP)':''; const a=JSON.stringify(data.args||{}); addCollapsibleBubble(data.via==='nlp'?'nlp-tool':'tool-call', `${i} ${data.tool}${v}${a!=='{}'?'('+a.substring(0,60)+')':''}`, null, data.content||''); }
            else if (role === 'tool_result') { addCollapsibleBubble('tool-result', `&#128203; ${data.tool} result`, null, (data.content||'').substring(0,500)); }
            else if (role === 'async_event') { addCollapsibleBubble('async-event', `&#128276; ${data.source}`, null, data.content||''); }
        });

        function addBubble(type, text, isStreaming=false) {
            const el = document.createElement('div'); el.className = `chat-bubble ${type}`;
            el.innerHTML = isStreaming ? '<div class="bubble-text"><span class="streaming"></span></div>' : `<div class="bubble-text">${esc(text)}</div>`;
            const t = document.createElement('div'); t.className='bubble-time'; t.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
            el.appendChild(t); chatHistory.appendChild(el); scrollChat(); return el;
        }
        function addCollapsibleBubble(type, label, sources, content) {
            const el = document.createElement('div'); el.className = `chat-bubble ${type} collapsible`;
            let h = label; if (sources && sources.length) h += ': ' + sources.map(s => s.title || s).join(', ');
            el.innerHTML = `<div class="bubble-header" onclick="this.parentElement.classList.toggle('expanded')">${h} <span class="toggle">&#9654;</span></div><div class="bubble-content">${esc(content||'')}</div>`;
            chatHistory.appendChild(el); scrollChat(); return el;
        }
        function finalizeStreaming() { if (currentAssistantBubble) { const s=currentAssistantBubble.querySelector('.streaming'); if(s){s.className='';s.style.color='#e0e0e0';} currentAssistantBubble=null; } }
        function scrollChat() { chatHistory.scrollTop = chatHistory.scrollHeight; }

        // ── Status ─────────────────────────────────────
        const toastEl = document.getElementById('status-toast');
        const toastText = toastEl.querySelector('.status-text');
        const statusDot = document.getElementById('status-dot');
        let toastHideTimer = null;

        socket.on('status_toast', (data) => {
            if (data.status === 'activity') return; // Handled by mode banner now
            if (data.status === 'shopping_mode') {
                const banner = document.getElementById('mode-banner');
                const bannerText = document.getElementById('mode-banner-text');
                if (data.mode === 'planning') { bannerText.textContent = '📝 Planning Mode — say items to add, "done" to exit'; banner.classList.add('visible'); }
                else if (data.mode === 'post_shopping') { bannerText.textContent = '🛒 Post-Shopping — say what you got, "done" to finish'; banner.classList.add('visible'); }
                else { banner.classList.remove('visible'); }
                return;
            }
            // Status dot
            statusDot.className = '';
            if (['listening','thinking','speaking','tool_call'].includes(data.status)) statusDot.classList.add(data.status);
            // Toast
            const status = data.status || 'idle', message = data.message || status;
            if (toastHideTimer) { clearTimeout(toastHideTimer); toastHideTimer = null; }
            toastEl.className = 'visible' + (status === 'speaking' ? ' status-speaking' : '');
            toastEl.id = 'status-toast';
            toastText.textContent = message;
            if (status === 'idle') toastHideTimer = setTimeout(() => toastEl.classList.remove('visible'), 2000);
            else if (status === 'user_speech') { toastText.textContent = '\u201C' + message + '\u201D'; toastHideTimer = setTimeout(() => toastEl.classList.remove('visible'), 5000); }
        });

        function esc(str) { if (!str) return ''; const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

        // ── Init ───────────────────────────────────────
        navigateTo('dashboard');
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('/static/sw.js').catch(() => {});
    </script>
</body>
</html>
