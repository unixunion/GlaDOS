[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Fast unit tests (no external services)
    integration: Requires running services (Qdrant, LM Studio)
    browser: Requires Playwright browser (slow)
    benchmark: Benchmark tests (not run by default)

# Default: run unit tests only (fast, no external deps)
addopts = -m "not integration and not browser and not benchmark" -v --tb=short
