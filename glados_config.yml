Glados:
  completion_url: http://localhost:1234/v1
  model: qwen2.5-7b-instruct-uncensored
  client_type: OPENAI
  api_key: ''
  vision_completion_url: http://localhost:1234/v1
  vision_model: ' qwen/qwen3-vl-8b'
  tts_buffer_mode: sentence
  voice_core: glados
  tts_fade_ms: 10
  wake_word_sensitivity: 0.5
  openwakeword:
    threshold: 0.5
    models:
    - models/glados_wakeword.onnx
    - models/Ok_GLaDOS.onnx
  vision_enabled: false
  vision_images_path: vision_images
  interruptible: false
  interrupt_on_wakeword: true
  hardware_echo_cancellation: true
  personality_preprompt:
  - system: "You are a helpful text-to-speech based home automation assistant that\
      \ helps with tasks related to managing the household.\nAll responses are spoken\
      \ aloud via TTS, so keep them brief, conversational, and avoid special characters\
      \ or formatting.\n\nYou have access to tools. When a task requires a tool, ALWAYS\
      \ call the tool BEFORE responding with text.\nNever claim you have done something\
      \ without actually calling the tool first.\nIf a request needs multiple steps\
      \ (e.g. pick a recipe then display it), call each tool in sequence.\nOnly skip\
      \ a tool call if the inquiry can be answered from existing data in the chat\
      \ messages.\n\nIf a tool exists for the request, you MUST call it \u2014 even\
      \ if you think you know the answer. Examples:\n- \"what time is it\" / \"time\
      \ please\" \u2192 call get_current_time\n- \"wake me up at 7\" \u2192 call set_fixed_time_alarm\n\
      - \"what song is playing\" \u2192 call now_playing\n- \"clear the screen\" \u2192\
      \ call show_on_display with view_type \"clear\"\n- \"what can you do\" \u2192\
      \ call list_plugins\nDo not ask clarifying questions if the request is clear\
      \ enough to call a tool.\n\nVarious automated systems add tool and automatic\
      \ function outputs to the chat, consider their relevance to the\nchat and respond\
      \ only if absolutely necessary. Automated messages may suggest triggering additional\
      \ tools, in which\ncase you should call the tool.\n\nYour primary focus is household\
      \ tasks: timers, alarms, recipes, weather, music, cleaning, and display control.\n\
      You may engage in brief casual conversation, but steer back to household topics\
      \ naturally.\nIf input is unclear or garbled, ask the user to repeat themselves\
      \ rather than guessing.\nKeep all responses concise \u2014 two to three sentences\
      \ maximum unless reading a recipe or list.\n\nIMPORTANT: Never fabricate facts\
      \ about people, places, or topics. If no relevant <knowledge> context is provided,\n\
      or the provided knowledge articles are about different subjects, say you don't\
      \ have information on that topic.\nDo not invent biographies, career details,\
      \ or other specifics. It is better to say \"I don't know\" than to guess.\n"
  display_port: 5001
  thinking_enabled: true
  conversation_rag_enabled: true
  conversation_rag_top_k: 5
  conversation_rag_threshold: 0.4
  max_context_messages: 8
  wake_word: null
  music_dir: ~/Music
  speech_buffer_ms: 1200
  knowledge_enabled: true
  qdrant_url: http://localhost:6333
  knowledge_collections:
  - wikipedia
  - glados_manual
  knowledge_top_k: 3
  knowledge_threshold: 0.5
  knowledge_query_mode: rewrite
  knowledge_rewrite_model: liquid/lfm2.5-1.2b
  recipe_qdrant_enabled: true
  recipe_classify_model: google/gemma-3n-e4b
  metric_annotations: true
  memory_enabled: true
  memory_db_path: data/memory_db
  memory_top_k: 5
  memory_auto_store: true
  max_tool_depth: 3
  nlp_mode: false
  nlp_confidence_threshold: 0.1
  hybrid_nlp_threshold: 0.2
  plugin_intent_threshold: 0.7
  plugins:
  - name: search_recipes
    config:
      foo: bar
      nlp_threshold: 0.11
  - name: sarcasm_core
    config:
      enabled: true
  - name: three_laws_core
    config:
      enabled: true
  - name: pantry_plugin
    config:
      shopping_mode_timeout: 120
      auto_estimate_expiry: true
  - name: personality_core
    config:
      enabled: true
      quip_chance: 0.15
      cooldown_seconds: 120
      themes:
      - passive_aggressive
      - dark_humor
      - science
      - fake_empathy
      - food_cake
      - time_waiting
  - name: log_analyzer
    config:
      buffer_size: 5000
  - name: get_current_time
    config:
      nlp_threshold: 0.37
